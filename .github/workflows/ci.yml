name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pin third-party actions to immutable commits; comments record the
      # reviewed release so Dependabot and maintainers can track upgrades.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # No DATABASE_URL/Supabase secrets are configured for CI — the
      # integration suite runs entirely against an in-memory pglite Postgres
      # (tests/integration/db.ts), so it needs none. This also means these
      # tests never verify anything against a real Supabase project; that
      # gap is intentional and documented in docs/database.md.
      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e
